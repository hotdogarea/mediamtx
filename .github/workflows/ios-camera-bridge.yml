name: boleme iOS build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned test app and injection dylib
        run: bash examples/ios-camera-bridge/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: boleme-build
          path: |
            examples/ios-camera-bridge/out/boleme-demo.ipa
            examples/ios-camera-bridge/out/boleme-clean-host.ipa
            examples/ios-camera-bridge/out/boleme.dylib
